[package]
name = "inkblade-probe"
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
description = "InkBlade in-pod probe: native template runtime (http/tcp/exec/fs/k8s/socks/spawn)"
license = "Apache-2.0"
publish = false

[[bin]]
name = "inkblade-probe"
path = "src/main.rs"

# Compile-time dependencies only.  The release binary is a single statically
# linked musl executable and has no runtime library dependency.
[dependencies]
serde_json = "1"
serde_yaml = "0.9"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"
# QUIC reverse transport.  quinn uses the same rustls version and the probe's
# pinned verifier; tokio is only the async runtime for the UDP/QUIC socket.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util"] }
# memfd_create / fchmod for the fileless execution primitive.  The crate is
# only used on Linux; the probe still builds on Windows for local tests.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[workspace]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Fast build for the QEMU TCG lab (the full LTO release build takes ~1 h under
# emulation).  The resulting binary is larger but functionally identical.
[profile.lab]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
