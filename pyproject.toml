[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inkblade"
version = "0.2.0"
description = "InkBlade (墨刃零) — authorized penetration-testing platform for Kubernetes ML training/inference clusters"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "The InkBlade Authors" }]
keywords = [
    "security",
    "penetration-testing",
    "kubernetes",
    "machine-learning",
    "llm",
    "ai-security",
    "purple-team",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
mlproxy = ["h2>=4.1"]

[project.scripts]
inkblade = "inkblade.cli:main"
# Deprecated compatibility entry: kept for one release, prints a migration hint.
trident = "inkblade.cli:legacy_main"

[tool.setuptools]
include-package-data = false
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["."]
include = ["inkblade*"]
exclude = ["tests*", "lab*", "scripts*", "reports*", "docs*"]
namespaces = false

[tool.setuptools.package-data]
inkblade = [
    "*.py",
    "chains/*.json",
    "core/*.json",
    "core/data/*.json",
    "assess/*.py",
    "data/supplychain/*.json",
    "data/supplychain/*.md",
    "data/supplychain/*.bin",
    "data/supplychain/attestations/*.json",
    "modules/*.py",
    "modules/*/*.json",
    "modules/*/*.py",
    "modules/*/*.md",
    "modules/*/*.txt",
    "rules/templates/*.json",
    "reports/*.json",
    "reports/templates/*.tmpl",
    "profiles/*.json",
    "data/*.json",
    "data/sigstore/*.json",
    "data/sigstore/*.pem",
    "probes/library/*/*.json",
    "tee/online_cache/*.json",
    "tee/online_cache/*.pem",
    "tee/online_cache/*.der",
    "tee/online_cache/*.txt",
    "sdk/*.py",
    "sdk/examples/*/*.py",
    "sdk/examples/*/*.json",
    "sdk/examples/*/*.md",
    "webui/static/*.html",
    "webui/static/*.js",
    "webui/static/*.css",
    "webui/static/vendor/*.js",
    "webui/static/vendor/*.css",
    "arch-intel/*.py",
    "arch-intel/*.json",
    "arch-intel/corpus/*.md",
    "arch-intel/corpus/*/*.md",
]
