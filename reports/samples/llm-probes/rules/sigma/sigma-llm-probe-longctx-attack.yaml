title: 长上下文滥用（超窗/KV/prefix cache）
id: e3f31e4d-5b39-7ab5-c8fe-f294f9c31f11
status: stable
description: "Long-context abuse (over-window/KV/prefix cache). 超窗请求仍放行、prefix cache 跨租户复用、KV 通道与 checkpoint 分片未授权写；来源=LLM 探针矩阵 longctx-attack 类。 检测规则与 inkblade/probes 探针库 longctx-attack 类一一联动（每类 ≥1 规则）。"
references:
  - "inkblade-rules-mapping: sigma-llm-probe-longctx-attack"
author: InkBlade rules engine
date: 2026/10/25
logsource:
  product: litellm
  service: llm-probes
detection:
  selection:
    event_kind:
      - llm_probe_sweep
      - llm_request
    category:
      - longctx-attack
  condition: selection
falsepositives:
  - 授权红队演练流量（以演练计划窗口与来源白名单收敛）
level: high
tags:
  - attack.t1499
  - inkblade
  - llm-probe
  - inkblade-mode-monitor
custom:
  inkblade-mode: monitor
  inkblade-tuning: 以网关 LLM 遥测流的 category 字段聚合告警（同会话多类命中即升级 critical）；授权红队演练窗口先加白，演练后恢复；建议同时记录 trace_id 以便回放定位探针
  inkblade-blocks-chains: ""
