title: AI 网关权限/资源滥用
id: 5901ae23-e1b3-ce9d-061f-1b8e9efa097e
status: stable
description: "AI gateway privilege and resource abuse. 未授权 key 签发、模型清单枚举、明文上游凭据、配额 XFF 轮换与开放中继；来源=LLM 探针矩阵 gateway-abuse 类。 检测规则与 inkblade/probes 探针库 gateway-abuse 类一一联动（每类 ≥1 规则）。"
references:
  - "inkblade-rules-mapping: sigma-llm-probe-gateway-abuse"
author: InkBlade rules engine
date: 2026/10/25
logsource:
  product: litellm
  service: llm-probes
detection:
  selection:
    event_kind:
      - llm_probe_sweep
      - llm_request
    category:
      - gateway-abuse
  condition: selection
falsepositives:
  - 内部巡检/压测作业（以管理员主体与 bastion 网段白名单）
level: high
tags:
  - attack.t1078
  - inkblade
  - llm-probe
  - inkblade-mode-monitor
custom:
  inkblade-mode: monitor
  inkblade-tuning: 以网关 LLM 遥测流的 category 字段聚合告警（同会话多类命中即升级 critical）；授权红队演练窗口先加白，演练后恢复；建议同时记录 trace_id 以便回放定位探针
  inkblade-blocks-chains: ""
