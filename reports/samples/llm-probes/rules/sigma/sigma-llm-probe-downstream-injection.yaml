title: 输出注入到下游 agent
id: 68cc4b24-e81b-bad6-77e5-7645b429447d
status: stable
description: "Output injection into downstream agents. 模型输出内嵌 agent 指令/伪造 tool-call JSON/MCP 结果投毒；来源=LLM 探针矩阵 downstream-injection 类。 检测规则与 trident/probes 探针库 downstream-injection 类一一联动（每类 ≥1 规则）。"
references:
  - "trident-rules-mapping: sigma-llm-probe-downstream-injection"
author: Trident rules engine
date: 2026/10/25
logsource:
  product: litellm
  service: llm-probes
detection:
  selection:
    event_kind:
      - llm_probe_sweep
      - llm_request
    category:
      - downstream-injection
  condition: selection
falsepositives:
  - 授权红队演练流量（以演练计划窗口与来源白名单收敛）
level: high
tags:
  - attack.t1204
  - trident
  - llm-probe
  - trident-mode-monitor
custom:
  trident-mode: monitor
  trident-tuning: 以网关 LLM 遥测流的 category 字段聚合告警（同会话多类命中即升级 critical）；授权红队演练窗口先加白，演练后恢复；建议同时记录 trace_id 以便回放定位探针
  trident-blocks-chains: ""
