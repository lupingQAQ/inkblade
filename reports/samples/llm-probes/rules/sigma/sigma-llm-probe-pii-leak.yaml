title: PII 索取与日志明文暴露
id: 1dfda763-21d9-cd64-7f9c-1d22e610a02a
status: stable
description: "PII solicitation and plaintext log exposure. 对话内 SSN/卡号索取、网关日志未授权拉取（邮箱/电话/卡号/Bearer 凭据）；来源=LLM 探针矩阵 pii-leak 类。 检测规则与 trident/probes 探针库 pii-leak 类一一联动（每类 ≥1 规则）。"
references:
  - "trident-rules-mapping: sigma-llm-probe-pii-leak"
author: Trident rules engine
date: 2026/10/25
logsource:
  product: litellm
  service: llm-probes
detection:
  selection:
    event_kind:
      - llm_probe_sweep
      - llm_request
    category:
      - pii-leak
  condition: selection
falsepositives:
  - 授权红队演练流量（以演练计划窗口与来源白名单收敛）
level: critical
tags:
  - attack.t1530
  - trident
  - llm-probe
  - trident-mode-monitor
custom:
  trident-mode: monitor
  trident-tuning: 以网关 LLM 遥测流的 category 字段聚合告警（同会话多类命中即升级 critical）；授权红队演练窗口先加白，演练后恢复；建议同时记录 trace_id 以便回放定位探针
  trident-blocks-chains: ""
