apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: inkblade-default-deny
  namespace: ray-system
  annotations:
    inkblade.io/mode: monitor
spec:
  endpointSelector: {}
  ingress: []
  egress: []

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: inkblade-partition-allow
  namespace: ray-system
  annotations:
    inkblade.io/mode: monitor
spec:
  endpointSelector:
    matchLabels:
      ray-system.inkblade-io-zone/member: true
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.podns: ml-training
      fromCIDR:
        - 192.168.10.0/24
      toPorts:
        - ports:
            - port: 8265
              protocol: TCP
            - port: 10001
              protocol: TCP
            - port: 6379
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: 53
              protocol: UDP
            - port: 53
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.podns: ml-training
    - toEndpoints:
        - matchLabels:
            io.kubernetes.podns: ml-inference
    - toEndpoints:
        - matchLabels:
            io.kubernetes.podns: monitoring

