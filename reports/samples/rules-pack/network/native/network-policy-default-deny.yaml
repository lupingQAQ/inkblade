apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inkblade-default-deny
  namespace: ray-system
  annotations:
    inkblade.io/mode: monitor
    inkblade.io/note: 默认拒绝（入站+出站）；试点后再全量铺开
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inkblade-partition-allow
  namespace: ray-system
  annotations:
    inkblade.io/mode: monitor
spec:
  podSelector:
    matchLabels:
      ray-system.inkblade-io-zone/member: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ml-training
        - ipBlock:
            cidr: 192.168.10.0/24
      ports:
        - protocol: TCP
          port: 8265
        - protocol: TCP
          port: 10001
        - protocol: TCP
          port: 6379
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ml-training
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ml-inference
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring

