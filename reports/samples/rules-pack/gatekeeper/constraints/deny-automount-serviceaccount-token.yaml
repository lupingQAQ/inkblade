apiVersion: constraints.gatekeeper.sh/v1beta1
kind: InkBladeDenyAutomountSAToken
metadata:
  name: inkblade-deny-automount-serviceaccount-token
  annotations:
    inkblade.io/mode: monitor
    inkblade.io/tuning: 确需令牌的工作负载（operator、Fluentd 采集器）放入白名单命名空间并在 SA 级显式开启；其余一律 false；配合 operator SA 约束（见 RBAC 收敛清单）
    inkblade.io/blocks-chains: "agent-platform-zero-precondition-lateral,ssrf-sa-token-cloud-metadata"
spec:
  enforcementAction: dryrun
  match:
    kinds:
      - apiGroups:
          - ""
          - apps
          - rbac.authorization.k8s.io
        kinds:
          - Pod
