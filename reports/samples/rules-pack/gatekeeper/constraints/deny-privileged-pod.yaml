apiVersion: constraints.gatekeeper.sh/v1beta1
kind: InkBladeDenyPrivilegedPod
metadata:
  name: inkblade-deny-privileged-pod
  annotations:
    inkblade.io/mode: monitor
    inkblade.io/tuning: 先以 monitor（Audit）观察 7 天并列出命中清单；GPU Operator/NVIDIA 驱动与 SR-IOV device plugin DaemonSet 移入例外命名空间并加镜像白名单后，再切换 Enforce；例外通道任何新增条目需二次审计
    inkblade.io/blocks-chains: "cluster-takeover-objective,gpu-network-operator-host-escape,imex-computedomain-gpu-memory-crossing,ray-dashboard-cluster-takeover"
spec:
  enforcementAction: dryrun
  match:
    kinds:
      - apiGroups:
          - ""
          - apps
          - rbac.authorization.k8s.io
        kinds:
          - Pod
