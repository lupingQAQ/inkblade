apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: denyautomountserviceaccounttoken
spec:
  crd:
    spec:
      names:
        kind: InkBladeDenyAutomountSAToken
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: "violation[{\"msg\": msg}] {\n  input.review.object.spec.automountServiceAccountToken != false\n  msg := \"automountServiceAccountToken must be explicitly false (allowlisted namespaces excepted)\"\n}"
