title: AI 网关默认 master key 使用
id: 4709a94a-2657-371d-b821-e8181456ad68
status: stable
description: Authentication with the well-known default master key (vendor default / sample config) succeeding against the AI gateway. 检测默认 master key 认证成功——默认凭据是上游 provider key 外泄链的第一步。
references:
  - "inkblade-rules-mapping: sigma-gateway-default-master-key-use"
author: InkBlade rules engine
date: 2026/10/25
logsource:
  product: litellm
  service: gateway-auth
detection:
  selection:
    verb:
      - authenticate
    key_class: default_master
    status:
      - 200
  condition: selection
falsepositives:
  - 尚未完成 master key 轮换的初始化窗口（应以一次性 bootstrap token 替代）
level: critical
tags:
  - attack.credential_access
  - attack.t1078
  - inkblade
  - inkblade-mode-monitor
custom:
  inkblade-mode: monitor
  inkblade-tuning: "默认 master key 在任何时点成功都应 critical；初始化窗口以一次性 bootstrap token（单次使用 + 自动失效）替代；同时监控 /key/generate 的 admin=true 签发与 master key 的调用来源网段"
  inkblade-blocks-chains: ai-gateway-key-exfil
