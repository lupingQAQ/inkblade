title: 异常主体读取 Secret
id: a7685c50-349a-a6c7-503f-2d93613511de
status: stable
description: "K8s audit: non-baseline subject reads/list secrets (SA token / cloud credential theft primitives). 审计检测非基线主体的 Secret 读取（SA 令牌、云凭据面）。"
references:
  - "trident-rules-mapping: sigma-secret-abnormal-read"
author: Trident rules engine
date: 2026/10/25
logsource:
  product: kubernetes
  service: audit
detection:
  selection:
    verb:
      - get
      - list
      - watch
    objectRef.resource: secret
    subject_sa:
      not_in:
        - "system:serviceaccount:kube-system:generic-garbage-collector"
        - "system:serviceaccount:monitoring:prometheus"
  condition: selection
falsepositives:
  - CI/CD 部署主体、密钥轮转 Job（按主体+时间段白名单）
level: high
tags:
  - attack.credential_access
  - attack.t1552
  - trident
  - trident-mode-monitor
custom:
  trident-mode: monitor
  trident-tuning: 以 30 天 audit 基线提取合法读 Secret 主体清单替换 not_in 白名单；对 instance-role/云凭据类 Secret 名称单独加规则并降低 list 误报（改 watch 审计）
  trident-blocks-chains: "agent-platform-cross-tenant-data-chain,agent-platform-zero-precondition-lateral,ali-ram-role-oss-weight,aws-role-weight-bucket,azure-managed-identity-blob-weight,ssrf-sa-token-cloud-metadata,tencent-cam-role-cos-weight"
