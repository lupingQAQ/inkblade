title: 语义缓存跨租户投毒
id: ad813ae3-6373-45fe-7a5f-7720f0e340f9
status: stable
description: "Semantic-cache cross-tenant poisoning. 共享前缀键跨租户命中、缓存条目覆写与前缀归一化碰撞劫持；来源=LLM 探针矩阵 cache-poison 类。 检测规则与 inkblade/probes 探针库 cache-poison 类一一联动（每类 ≥1 规则）。"
references:
  - "inkblade-rules-mapping: sigma-llm-probe-cache-poison"
author: InkBlade rules engine
date: 2026/10/25
logsource:
  product: litellm
  service: llm-probes
detection:
  selection:
    event_kind:
      - llm_probe_sweep
      - llm_request
    category:
      - cache-poison
  condition: selection
falsepositives:
  - 授权红队演练流量（以演练计划窗口与来源白名单收敛）
level: critical
tags:
  - attack.t1550
  - inkblade
  - llm-probe
  - inkblade-mode-monitor
custom:
  inkblade-mode: monitor
  inkblade-tuning: 以网关 LLM 遥测流的 category 字段聚合告警（同会话多类命中即升级 critical）；授权红队演练窗口先加白，演练后恢复；建议同时记录 trace_id 以便回放定位探针
  inkblade-blocks-chains: ""
