title: 跨账户 AssumeRole（trust policy 通配）
id: 86bdf6d0-9a29-b094-2209-9615218f6b73
status: stable
description: "CloudTrail STS: AssumeRole from a foreign account against a role whose trust policy has a wildcard principal. 云身份联邦通配信任导致跨账户角色假定。"
references:
  - "inkblade-rules-mapping: sigma-cloud-cross-account-assume"
author: InkBlade rules engine
date: 2026/10/25
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: AssumeRole
    crossAccount: true
    trustPolicyWildcard: true
  condition: selection
falsepositives:
  - 集团统一身份提供商下的合法跨账户角色链（按 sourceAccount+roleArn 白名单）
level: critical
tags:
  - attack.credential_access
  - attack.t1552.005
  - inkblade
  - inkblade-mode-monitor
custom:
  inkblade-mode: monitor
  inkblade-tuning: "以组织级 sourceAccount/roleArn 白名单收敛合法跨账户链路；对 Principal='*' 且无 sts:ExternalId/Condition 的角色直接 critical；联动 CloudTrail AssumeRole + S3 ListBucket 事件"
  inkblade-blocks-chains: cloud-cross-tenant-role-assume
