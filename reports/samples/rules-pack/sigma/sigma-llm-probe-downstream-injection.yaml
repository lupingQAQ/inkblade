title: 输出注入到下游 agent
id: 4b73e5fa-d25b-9d3b-25e9-60b4361e5264
status: stable
description: "Output injection into downstream agents. 模型输出内嵌 agent 指令/伪造 tool-call JSON/MCP 结果投毒；来源=LLM 探针矩阵 downstream-injection 类。 检测规则与 inkblade/probes 探针库 downstream-injection 类一一联动（每类 ≥1 规则）。"
references:
  - "inkblade-rules-mapping: sigma-llm-probe-downstream-injection"
author: InkBlade rules engine
date: 2026/10/25
logsource:
  product: litellm
  service: llm-probes
detection:
