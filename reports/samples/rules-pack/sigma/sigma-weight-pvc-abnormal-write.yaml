title: 权重/检查点 PVC 异常写（claim 级变更或非基线主体挂载）
id: 3e9c5108-ab8e-4282-be08-bb7d9b089638
status: stable
description: "K8s audit: create/update/patch of weight/checkpoint-class PersistentVolumeClaims by a non-baseline subject, or pod creation mounting them outside the platform scheduler. 检测共享模型数据面（权重/检查点 PVC）的异常写通道（供应链投毒入口）。"
references:
  - "inkblade-rules-mapping: sigma-weight-pvc-abnormal-write"
author: InkBlade rules engine
date: 2026/10/25
logsource:
  product: kubernetes
  service: audit
detection:
  selection:
    verb:
      - create
      - update
      - patch
    objectRef.resource:
      - persistentvolumeclaims
    subject_sa:
      not_in:
        - "system:serviceaccount:ml-training:platform-scheduler"
        - "system:serviceaccount:kube-system:storage-operator"
  condition: selection
falsepositives:
  - 存储运维扩容（storage-operator 主体白名单）、平台调度器例行挂载（platform-scheduler）
level: high
tags:
  - attack.impact
  - attack.t1565.001
  - inkblade
  - inkblade-mode-monitor
custom:
  inkblade-mode: monitor
  inkblade-tuning: 先收敛 claim 写主体到存储运维/平台调度器两个 SA；权重类名称（weights/model-weights/hf-cache/checkpoint）单独加正则子规则并保持 high；挂载级异常与 falco-weight-file-abnormal-write 联动定位写进程
  inkblade-blocks-chains: shared-pvc-supply-chain-poison
