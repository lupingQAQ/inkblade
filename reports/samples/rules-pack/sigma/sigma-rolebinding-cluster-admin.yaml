title: 指向 cluster-admin 的 RoleBinding 创建
id: f3fe0e2c-e307-ff88-9c56-28b4b748588b
status: stable
description: "K8s audit: creation of RoleBinding/ClusterRoleBinding referencing cluster-admin (operator/RBAC takeover primitive). English: audit-detect RoleBinding creation pointing at cluster-admin."
references:
  - "trident-rules-mapping: sigma-rolebinding-cluster-admin"
author: Trident rules engine
date: 2026/10/25
logsource:
  product: kubernetes
  service: audit
detection:
  selection:
    verb:
      - create
    objectRef.resource:
      - rolebinding
      - clusterrolebinding
    objectRef.roleRef.name: cluster-admin
  condition: selection
falsepositives:
  - gitops/CI 同步主体的合法绑定（以主体白名单收敛）
level: critical
tags:
  - attack.privilege_escalation
  - attack.t1098
  - trident
  - trident-mode-monitor
custom:
  trident-mode: monitor
  trident-tuning: 对 argocd/gitops 与 operator 的常规绑定建立主体白名单（user.username/serviceaccount），仅对指向 cluster-admin 的增量绑定保持 critical；建议同时监控 rolebindings 的 delete（清理痕迹）
  trident-blocks-chains: ray-dashboard-cluster-takeover
