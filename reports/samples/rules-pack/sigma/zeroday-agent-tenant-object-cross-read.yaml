title: Agent 平台租户对象跨租户读取
id: 9808db67-4040-c701-d909-3d0b6a2d1189
status: stable
description: "Agent 平台审计面：单会话主体在短时间内读取不属于自身租户的绑定/快照类对象。English: a single session principal reading tenant-scoped objects across tenant boundaries in a short window."
references:
  - "inkblade-rules-mapping: zeroday-agent-tenant-object-cross-read"
author: InkBlade rules engine
date: 2026/10/25
logsource:
  category: agent-platform
detection:
  selection:
    action:
      - read
      - list
      - materialize
    object_class: tenant-binding
    cross_tenant: true
  condition: "selection | count() by subject > 3 in 5m"
falsepositives:
  - 平台运维主体的租户迁移作业（按运维账号+时间窗白名单）
level: critical
tags:
  - attack.credential_access
  - inkblade
  - zeroday-behavioral
  - inkblade-mode-monitor
custom:
  inkblade-mode: monitor
  inkblade-tuning: 阈值（5 分钟 3 次）按平台吞吐校准；对 object_class 扩展到快照/数据集导出类对象；运维迁移窗口以主体白名单收敛
  inkblade-blocks-chains: agent-platform-cross-tenant-data-chain
