apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: trident-deny-automount-serviceaccount-token
  annotations:
    trident.io/mode: monitor
    trident.io/tuning: 确需令牌的工作负载（operator、Fluentd 采集器）放入白名单命名空间并在 SA 级显式开启；其余一律 false；配合 operator SA 约束（见 RBAC 收敛清单）
    trident.io/blocks-chains: "agent-platform-zero-precondition-lateral,ssrf-sa-token-cloud-metadata"
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-automount-disabled
      match:
        anyResources:
          - kinds:
              - Pod
      validate:
        message: 工作负载未显式关闭 automountServiceAccountToken（默认拒绝，需显式 opt-out 清单） / Workload does not explicitly disable automountServiceAccountToken (default deny with explicit opt-out list)
        deny:
          conditions:
            - key: "{{ request.object.spec.automountServiceAccountToken || `true` }}"
              operator: NotEquals
              value: false
