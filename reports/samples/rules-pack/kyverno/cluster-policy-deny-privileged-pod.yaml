apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: trident-deny-privileged-pod
  annotations:
    trident.io/mode: monitor
    trident.io/tuning: 先以 monitor（Audit）观察 7 天并列出命中清单；GPU Operator/NVIDIA 驱动与 SR-IOV device plugin DaemonSet 移入例外命名空间并加镜像白名单后，再切换 Enforce；例外通道任何新增条目需二次审计
    trident.io/blocks-chains: "cluster-takeover-objective,gpu-network-operator-host-escape,imex-computedomain-gpu-memory-crossing,ray-dashboard-cluster-takeover"
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: deny-privileged-workload
      match:
        anyResources:
          - kinds:
              - Pod
      validate:
        message: 拒绝 privileged/hostPID/hostIPC/hostNetwork 工作负载（PSS baseline，GPU 驱动走例外通道） / Privileged/hostPID/hostIPC/hostNetwork workload denied (PSS baseline; GPU drivers via exception channel)
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.containers[].securityContext.privileged[] || `[]` }}"
                operator: AnyIn
                value:
                  - true
              - key: "{{ request.object.spec.hostPID || `false` }}"
                operator: Equals
                value: true
              - key: "{{ request.object.spec.hostIPC || `false` }}"
                operator: Equals
                value: true
              - key: "{{ request.object.spec.hostNetwork || `false` }}"
                operator: Equals
                value: true
