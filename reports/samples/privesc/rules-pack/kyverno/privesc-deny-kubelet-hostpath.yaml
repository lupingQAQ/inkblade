apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: inkblade-privesc-deny-kubelet-hostpath
  annotations:
    inkblade.io/mode: monitor
    inkblade.io/vector: workload-hostpath-kubelet
    inkblade.io/tuning: 先 Audit 观察基线；确认无合法例外后切 Enforce
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: privesc-deny-kubelet-hostpath
      match:
        anyResources:
          - kinds:
              - Pod
      validate:
        message: 拒绝 kubelet/kubernetes 目录 hostPath / Deny kubelet hostPath
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.volumes[].hostPath.path[] || `[]` }}"
                operator: AnyIn
                value:
                  - /var/lib/kubelet
                  - /etc/kubernetes
                  - /var/run/containerd/containerd.sock
                  - /var/run/docker.sock
                  - /run/crio/crio.sock
