# trident.io/vector: node-host-root-kubeconfig
# detection-point: Falco：容器/宿主进程读取 admin kubeconfig
- rule: Trident Privesc node-host-root-kubeconfig
  desc: 宿主 root 读取 kubeconfig
  condition: "evt.type in (open,openat,connect,execve) and path ~ \"(admin\\.conf|k3s\\.yaml)$\""
  output: "Trident privilege-escalation primitive (vector=node-host-root-kubeconfig module=runtime-socket-escape proc=%proc.name)"
  priority: CRITICAL
  tags:
    - trident
    - privesc
    - node
    - node-host-root-kubeconfig
