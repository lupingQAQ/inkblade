# inkblade.io/vector: workload-static-pod-write
# detection-point: Falco：写入 kubelet 静态 Pod 目录
- rule: InkBlade Privesc workload-static-pod-write
  desc: 静态 Pod 清单写入
  condition: "evt.type in (open,openat,connect,execve) and path ~ \"^/etc/kubernetes/manifests/\""
  output: "InkBlade privilege-escalation primitive (vector=workload-static-pod-write module=runtime-socket-escape proc=%proc.name)"
  priority: WARNING
  tags:
    - inkblade
    - privesc
    - workload
    - workload-static-pod-write
