# inkblade.io/vector: workload-hostpath-runtime-socket
# detection-point: Falco：容器内进程打开容器运行时 socket
- rule: InkBlade Privesc workload-hostpath-runtime-socket
  desc: hostPath 挂载运行时 socket
  condition: "evt.type in (open,openat,connect,execve) and proc=\"ctr\" and path ~ \"containerd\\.sock$\""
  output: "InkBlade privilege-escalation primitive (vector=workload-hostpath-runtime-socket module=runtime-socket-escape proc=%proc.name)"
  priority: WARNING
  tags:
    - inkblade
    - privesc
    - workload
    - workload-hostpath-runtime-socket
