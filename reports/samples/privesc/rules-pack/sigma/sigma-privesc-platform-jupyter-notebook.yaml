kind: SigmaRule
title: Jupyter Notebook 代码执行
id: 058829fc-11d9-e4b4-1b8d-4844203916c2
status: stable
description: 在 notebook 内执行 Python/shell，读取 SA token、访问集群 API 或挂载的宿主/共享卷，进入训练命名空间。
references:
  - "JupyterHub 安全文档 https://jupyterhub.readthedocs.io/en/stable/reference/security.html"
  - "MITRE ATT&CK T1610 Deploy Container https://attack.mitre.org/techniques/T1610/"
author: InkBlade privesc matrix
metadata:
  author: InkBlade privesc matrix
  annotations:
    inkblade.io/vector: platform-jupyter-notebook
    inkblade.io/module: framework-port-matching
date: 2026/10/26
logsource:
  product: kubernetes
  service: audit
detection:
  selection:
    verb:
      - create
    objectRef.resource:
      - pods/exec
    authenticationInfo.username:
      re: "serviceaccount:.*:jupyter"
  condition: selection
falsepositives:
  - 授权的运维/CI 变更（按主体白名单收敛）
level: high
tags:
  - attack.privilege_escalation
  - inkblade
  - inkblade.vector.platform
  - attack.t1610
  - inkblade-mode-monitor
custom:
  inkblade-mode: monitor
  inkblade-vector: platform-jupyter-notebook
  inkblade-module: framework-port-matching
  inkblade-detection-point: K8s audit：Jupyter SA 发起 pods/exec
  inkblade-replay:
    match:
      engine: sigma
      logsource:
        product: kubernetes
        service: audit
      selection:
        verb:
          - create
        objectRef.resource:
          - pods/exec
        authenticationInfo.username:
          re: "serviceaccount:.*:jupyter"
    event:
      kind: sigma
      logsource:
        product: kubernetes
        service: audit
      verb: create
      objectRef:
        resource: pods/exec
      authenticationInfo:
        username: "system:serviceaccount:ops:jupyter"
