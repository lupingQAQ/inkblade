kind: SigmaRule
title: CRD conversion webhook 拦截/伪造
id: d0459585-e572-085c-dd9e-0313c55b65ac
status: stable
description: 接管 CRD 版本转换，读取/篡改所有 CR 对象（训练作业、凭据引用、RayCluster 配置），或返回恶意转换结果触发控制器 RCE。
references:
  - "Kubernetes CRD conversion https://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definition-versioning/"
  - "MITRE ATT&CK T1098 Account Manipulation https://attack.mitre.org/techniques/T1098/"
  - "KubeHound RBAC 攻击图 https://github.com/DataDog/KubeHound"
author: InkBlade privesc matrix
metadata:
  author: InkBlade privesc matrix
  annotations:
    inkblade.io/vector: rbac-crd-conversion-webhook
    inkblade.io/module: crd-conversion-webhook
date: 2026/10/26
logsource:
  product: kubernetes
  service: audit
detection:
  selection:
    verb:
      - create
      - update
      - patch
    objectRef.resource:
      - customresourcedefinitions
    requestObject.spec.conversion.strategy: Webhook
  condition: selection
falsepositives:
  - 授权的运维/CI 变更（按主体白名单收敛）
level: high
tags:
  - attack.privilege_escalation
  - inkblade
  - inkblade.vector.rbac
  - attack.t1098
  - inkblade-mode-monitor
custom:
  inkblade-mode: monitor
  inkblade-vector: rbac-crd-conversion-webhook
  inkblade-module: crd-conversion-webhook
  inkblade-detection-point: "K8s audit：CRD 创建/更新且 conversion.strategy=Webhook"
  inkblade-replay:
    match:
      engine: sigma
      logsource:
        product: kubernetes
        service: audit
      selection:
        verb:
          - create
          - update
          - patch
        objectRef.resource:
          - customresourcedefinitions
        requestObject.spec.conversion.strategy: Webhook
    event:
      kind: sigma
      logsource:
        product: kubernetes
        service: audit
      verb: create
      objectRef:
        resource: customresourcedefinitions
      requestObject:
        spec:
          conversion:
            strategy: Webhook
