kind: SigmaRule
title: legacy SA token Secret 读取
id: ab069d10-5d8e-b7a5-e61f-1c3b33117cad
status: stable
description: "读取 type=kubernetes.io/service-account-token 的 Secret，获得永不过期（或长期）SA token。"
references:
  - "Kubernetes Secret 文档 https://kubernetes.io/docs/concepts/configuration/secret/"
  - "MITRE ATT&CK T1552 Unsecured Credentials https://attack.mitre.org/techniques/T1552/"
  - "KubeHound RBAC 攻击图 https://github.com/DataDog/KubeHound"
author: Trident privesc matrix
metadata:
  author: Trident privesc matrix
  annotations:
    trident.io/vector: cred-legacy-sa-secret
    trident.io/module: secret-scanner
date: 2026/10/26
logsource:
  product: kubernetes
  service: audit
detection:
  selection:
    verb:
      - get
      - list
    objectRef.resource:
      - secrets
    requestObject.secretType: kubernetes.io/service-account-token
  condition: selection
falsepositives:
  - 授权的运维/CI 变更（按主体白名单收敛）
level: high
tags:
  - attack.privilege_escalation
  - trident
  - trident.vector.credential
  - attack.t1552
  - trident-mode-monitor
custom:
  trident-mode: monitor
  trident-vector: cred-legacy-sa-secret
  trident-module: secret-scanner
  trident-detection-point: K8s audit：读取 legacy SA token Secret
  trident-replay:
    match:
      engine: sigma
      logsource:
        product: kubernetes
        service: audit
      selection:
        verb:
          - get
          - list
        objectRef.resource:
          - secrets
        requestObject.secretType: kubernetes.io/service-account-token
    event:
      kind: sigma
      logsource:
        product: kubernetes
        service: audit
      verb: get
      objectRef:
        resource: secrets
      requestObject:
        secretType: kubernetes.io/service-account-token
