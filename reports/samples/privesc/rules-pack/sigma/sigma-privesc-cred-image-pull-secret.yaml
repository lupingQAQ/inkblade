kind: SigmaRule
title: imagePullSecret 窃取/镜像投毒
id: 78e92793-0daf-9b86-7a6e-9e77d858f2f3
status: stable
description: 读取 dockerconfigjson 凭据，向训练/推理镜像仓库推送恶意镜像；operator/DaemonSet 拉取后获得其 SA 权限。
references:
  - "Kubernetes Secret 文档 https://kubernetes.io/docs/concepts/configuration/secret/"
  - "MITRE ATT&CK T1525 Implant Internal Image https://attack.mitre.org/techniques/T1525/"
  - "KubeHound RBAC 攻击图 https://github.com/DataDog/KubeHound"
author: InkBlade privesc matrix
metadata:
  author: InkBlade privesc matrix
  annotations:
    inkblade.io/vector: cred-image-pull-secret
    inkblade.io/module: image-pull-secret-theft
date: 2026/10/26
logsource:
  product: kubernetes
  service: audit
detection:
  selection:
    verb:
      - get
      - list
    objectRef.resource:
      - secrets
    requestObject.secretType: kubernetes.io/dockerconfigjson
  condition: selection
falsepositives:
  - 授权的运维/CI 变更（按主体白名单收敛）
level: high
tags:
  - attack.privilege_escalation
  - inkblade
  - inkblade.vector.credential
  - attack.t1525
  - attack.t1195
  - inkblade-mode-monitor
custom:
  inkblade-mode: monitor
  inkblade-vector: cred-image-pull-secret
  inkblade-module: image-pull-secret-theft
  inkblade-detection-point: K8s audit：读取 dockerconfigjson Secret
  inkblade-replay:
    match:
      engine: sigma
      logsource:
        product: kubernetes
        service: audit
      selection:
        verb:
          - get
          - list
        objectRef.resource:
          - secrets
        requestObject.secretType: kubernetes.io/dockerconfigjson
    event:
      kind: sigma
      logsource:
        product: kubernetes
        service: audit
      verb: get
      objectRef:
        resource: secrets
      requestObject:
        secretType: kubernetes.io/dockerconfigjson
