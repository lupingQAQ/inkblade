kind: SigmaRule
title: Kueue/Volcano 队列提权
id: 28e99ed7-93d5-9f35-4817-fdc82b2bcd70
status: stable
description: 篡改队列资源配额/命名空间映射，把高权命名空间的 Pod 调度到攻击者模板；或提交 privileged Job 绕过准入。
references:
  - "Kueue 文档 https://kueue.sigs.k8s.io/docs/"
  - "Volcano 文档 https://volcano.sh/en/docs/"
  - "MITRE ATT&CK T1610 Deploy Container https://attack.mitre.org/techniques/T1610/"
author: Trident privesc matrix
metadata:
  author: Trident privesc matrix
  annotations:
    trident.io/vector: platform-kueue-volcano
    trident.io/module: gang-scheduler-abuse
date: 2026/10/26
logsource:
  product: kubernetes
  service: audit
detection:
  selection:
    verb:
      - create
      - update
    objectRef.resource:
      - clusterqueues
      - queues
  condition: selection
falsepositives:
  - 授权的运维/CI 变更（按主体白名单收敛）
level: high
tags:
  - attack.privilege_escalation
  - trident
  - trident.vector.platform
  - attack.t1610
  - trident-mode-monitor
custom:
  trident-mode: monitor
  trident-vector: platform-kueue-volcano
  trident-module: gang-scheduler-abuse
  trident-detection-point: K8s audit：队列/配额对象变更
  trident-replay:
    match:
      engine: sigma
      logsource:
        product: kubernetes
        service: audit
      selection:
        verb:
          - create
          - update
        objectRef.resource:
          - clusterqueues
          - queues
    event:
      kind: sigma
      logsource:
        product: kubernetes
        service: audit
      verb: update
      objectRef:
        resource: clusterqueues
