kind: SigmaRule
title: hostPID/hostNetwork/hostIPC 宿主命名空间
id: 3d11a552-327b-806a-30e4-f69016655d7d
status: stable
description: 共享宿主 PID/网络/IPC 命名空间：nsenter 进入宿主进程、抓取节点流量、访问 localhost 管理面与 kubelet。
references:
  - "Kubernetes Pod 安全标准 https://kubernetes.io/docs/concepts/security/pod-security-standards/"
  - "MITRE ATT&CK T1611 Escape to Host https://attack.mitre.org/techniques/T1611/"
  - "Peirates Kubernetes 提权 https://github.com/inguardians/peirates"
author: Trident privesc matrix
metadata:
  author: Trident privesc matrix
  annotations:
    trident.io/vector: workload-hostpid-hostnetwork
    trident.io/module: privileged-workloads
date: 2026/10/26
logsource:
  product: kubernetes
  service: audit
detection:
  selection:
    verb:
      - create
    objectRef.resource:
      - pods
    requestObject.hostPID: true
  condition: selection
falsepositives:
  - 授权的运维/CI 变更（按主体白名单收敛）
level: high
tags:
  - attack.privilege_escalation
  - trident
  - trident.vector.workload
  - attack.t1610
  - attack.t1611
  - trident-mode-monitor
custom:
  trident-mode: monitor
  trident-vector: workload-hostpid-hostnetwork
  trident-module: privileged-workloads
  trident-detection-point: "K8s audit：create pod 且 hostPID/hostNetwork/hostIPC=true"
  trident-replay:
    match:
      engine: sigma
      logsource:
        product: kubernetes
        service: audit
      selection:
        verb:
          - create
        objectRef.resource:
          - pods
        requestObject.hostPID: true
    event:
      kind: sigma
      logsource:
        product: kubernetes
        service: audit
      verb: create
      objectRef:
        resource: pods
      requestObject:
        hostPID: true
