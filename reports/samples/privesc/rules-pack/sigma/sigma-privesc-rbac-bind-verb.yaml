kind: SigmaRule
title: bind 动词直接绑定 cluster-admin
id: f358bbcb-83d6-8e63-ae11-aee7a8abe70e
status: stable
description: 创建指向 cluster-admin 的 ClusterRoleBinding 并绑定自身 SA；kube-apiserver 的提权防护因 bind 而放行。
references:
  - "Kubernetes RBAC 文档 https://kubernetes.io/docs/reference/access-authn-authz/rbac/"
  - "MITRE ATT&CK T1098 Account Manipulation https://attack.mitre.org/techniques/T1098/"
  - "KubeHound RBAC 攻击图 https://github.com/DataDog/KubeHound"
author: InkBlade privesc matrix
metadata:
  author: InkBlade privesc matrix
  annotations:
    inkblade.io/vector: rbac-bind-verb
    inkblade.io/module: rbac-bind-verb
date: 2026/10/26
logsource:
  product: kubernetes
  service: audit
detection:
  selection:
    verb:
      - create
      - update
    objectRef.resource:
      - rolebindings
      - clusterrolebindings
    objectRef.roleRef.name: cluster-admin
  condition: selection
falsepositives:
  - 授权的运维/CI 变更（按主体白名单收敛）
level: high
tags:
  - attack.privilege_escalation
  - inkblade
  - inkblade.vector.rbac
  - attack.t1098
  - inkblade-mode-monitor
custom:
  inkblade-mode: monitor
  inkblade-vector: rbac-bind-verb
  inkblade-module: rbac-bind-verb
  inkblade-detection-point: "K8s audit：创建/更新 roleRef=cluster-admin 的绑定"
  inkblade-replay:
    match:
      engine: sigma
      logsource:
        product: kubernetes
        service: audit
      selection:
        verb:
          - create
          - update
        objectRef.resource:
          - rolebindings
          - clusterrolebindings
        objectRef.roleRef.name: cluster-admin
    event:
      kind: sigma
      logsource:
        product: kubernetes
        service: audit
      verb: create
      objectRef:
        resource: clusterrolebindings
        roleRef:
          name: cluster-admin
