kind: SigmaRule
title: Ingress 控制器读全集群 TLS/流量
id: fc2ebf78-6a7d-521b-7eb5-11fc11a1aed1
status: stable
description: 通过恶意 Ingress/Annotation 读取任意命名空间 TLS Secret、代理到内部服务、注入配置执行（CVE 历史）或劫持流量。
references:
  - "ingress-nginx 安全公告/文档 https://kubernetes.github.io/ingress-nginx/"
  - "MITRE ATT&CK T1098 Account Manipulation https://attack.mitre.org/techniques/T1098/"
author: Trident privesc matrix
metadata:
  author: Trident privesc matrix
  annotations:
    trident.io/vector: platform-ingress-secret
    trident.io/module: observability-exposure
date: 2026/10/26
logsource:
  product: kubernetes
  service: audit
detection:
  selection:
    verb:
      - create
      - update
    objectRef.resource:
      - ingresses
    requestObject.annotation:
      re: "nginx\\.ingress\\.kubernetes\\.io/"
  condition: selection
falsepositives:
  - 授权的运维/CI 变更（按主体白名单收敛）
level: high
tags:
  - attack.privilege_escalation
  - trident
  - trident.vector.platform
  - attack.t1098
  - attack.t1552
  - trident-mode-monitor
custom:
  trident-mode: monitor
  trident-vector: platform-ingress-secret
  trident-module: observability-exposure
  trident-detection-point: K8s audit：Ingress 创建/更新含危险 annotation
  trident-replay:
    match:
      engine: sigma
      logsource:
        product: kubernetes
        service: audit
      selection:
        verb:
          - create
          - update
        objectRef.resource:
          - ingresses
        requestObject.annotation:
          re: "nginx\\.ingress\\.kubernetes\\.io/"
    event:
      kind: sigma
      logsource:
        product: kubernetes
        service: audit
      verb: create
      objectRef:
        resource: ingresses
      requestObject:
        annotation: nginx.ingress.kubernetes.io/configuration-snippet
