apiVersion: batch/v1
kind: Job
metadata:
  name: trainer
spec:
  template:
    spec:
      hostNetwork: true
      containers:
        - name: trainer
          securityContext:
            privileged: true
          volumeMounts:
            - name: host-root
              mountPath: /host
      volumes:
        - name: host-root
          hostPath:
            path: /
