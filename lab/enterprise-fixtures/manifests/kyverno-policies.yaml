apiVersion: v1
kind: List
items:
  - apiVersion: kyverno.io/v1
    kind: ClusterPolicy
    metadata:
      name: deny-privileged
    spec:
      validationFailureAction: Enforce
      rules:
        - name: deny-privileged
          match:
            any:
              - resources:
                  kinds:
                    - Pod
          validate:
            message: deny-privileged fixture policy
            pattern:
              spec:
                securityContext:
                  runAsNonRoot: true
