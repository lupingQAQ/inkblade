# Benign admission probes for the Kyverno Enforce policies.
# No workload performs any action; images are already present on the node.
apiVersion: v1
kind: Pod
metadata:
  name: kyverno-probe-privileged
  namespace: defense-lab
  labels:
    defense-lab-probe: "privileged"
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: probe
      image: docker.io/library/alpine:3.21
      command: ["/bin/sh", "-c", "echo INKBLADE-BENIGN:admission:enforced-path; sleep 5"]
      securityContext:
        privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: kyverno-probe-hostpath
  namespace: defense-lab
  labels:
    defense-lab-probe: "hostpath"
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: probe
      image: docker.io/library/alpine:3.21
      command: ["/bin/sh", "-c", "echo INKBLADE-BENIGN:admission:enforced-path; sleep 5"]
  volumes:
    - name: host
      hostPath:
        path: /tmp
---
apiVersion: v1
kind: Pod
metadata:
  name: kyverno-probe-automount
  namespace: defense-lab
  labels:
    defense-lab-probe: "automount"
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: docker.io/library/alpine:3.21
      command: ["/bin/sh", "-c", "echo INKBLADE-BENIGN:admission:enforced-path; sleep 5"]
---
apiVersion: v1
kind: Pod
metadata:
  name: kyverno-probe-compliant
  namespace: defense-lab
  labels:
    defense-lab-probe: "compliant"
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: probe
      image: docker.io/library/alpine:3.21
      command: ["/bin/sh", "-c", "echo INKBLADE-BENIGN:admission:enforced-path; sleep 5"]
      securityContext:
        privileged: false
---
apiVersion: v1
kind: Pod
metadata:
  name: kyverno-probe-privileged-unscoped
  namespace: default
  labels:
    defense-lab-probe: "exempt-namespace"
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: probe
      image: docker.io/library/alpine:3.21
      command: ["/bin/sh", "-c", "echo INKBLADE-BENIGN:admission:exempt-namespace-path; sleep 5"]
      securityContext:
        privileged: true
