apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter
  namespace: ml
spec:
  selector:
    matchLabels:
      app: jupyter
  template:
    metadata:
      labels:
        app: jupyter
    spec:
      containers:
        - name: jupyter
          image: jupyter/scipy-notebook:latest
          command: ["start-notebook.sh"]
          args: ["--NotebookApp.token=''", "--NotebookApp.password=''", "--allow-root"]
          securityContext:
            runAsUser: 0
          ports:
            - containerPort: 8888
---
apiVersion: v1
kind: Service
metadata:
  name: jupyter
  namespace: ml
spec:
  type: NodePort
  ports:
    - port: 8888
      nodePort: 30888
