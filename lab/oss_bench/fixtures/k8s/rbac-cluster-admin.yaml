apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trainer-cluster-admin
subjects:
  - kind: ServiceAccount
    name: trainer
    namespace: ml
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wildcard-read
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
