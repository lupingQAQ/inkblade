apiVersion: v1
kind: Pod
metadata:
  name: posture-recon
  namespace: trident-bypass
  labels:
    app: posture-recon
spec:
  serviceAccountName: defense-recon
  hostPID: true
  containers:
    - name: probe
      image: alpine:3.21
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c", "sleep 7200"]
      securityContext:
        privileged: true
      volumeMounts:
        - name: host-root
          mountPath: /host
          readOnly: true
        - name: probe
          mountPath: /opt/inkblade
          readOnly: true
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 200m, memory: 192Mi}
  volumes:
    - name: host-root
      hostPath:
        path: /
    - name: probe
      hostPath:
        path: /opt/inkblade
