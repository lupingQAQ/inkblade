apiVersion: v1
kind: Namespace
metadata:
  name: trident-bypass
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: defense-recon
  namespace: trident-bypass
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trident-bypass-defense-recon
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: defense-recon
    namespace: trident-bypass
---
apiVersion: v1
kind: Namespace
metadata:
  name: trident-target
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bypass-exec
  namespace: trident-bypass
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bypass-exec-pods
  namespace: trident-target
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bypass-exec-pods
  namespace: trident-target
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bypass-exec-pods
subjects:
  - kind: ServiceAccount
    name: bypass-exec
    namespace: trident-bypass
