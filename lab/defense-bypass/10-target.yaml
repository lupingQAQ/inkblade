apiVersion: v1
kind: Pod
metadata:
  name: lateral-target
  namespace: trident-target
  labels:
    app: lateral-target
spec:
  automountServiceAccountToken: false
  containers:
    - name: target
      image: alpine:3.21
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c", "sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
