# Vulnerable Slurm control-plane fixture (synthetic; no live cluster).
ClusterName=prod-hpc
SlurmctldHost=ctld-01
SlurmUser=root
AuthType=auth/none
CryptoType=crypto/openssl
TaskPlugin=task/none
ProctrackType=proctrack/pgid
SelectType=select/linear
MpiDefault=none
SlurmctldParameters=enable_configless,id_check
PrivateData=none
DisableRootJobs=NO
Prolog=/etc/slurm/prolog.sh
Epilog=/etc/slurm/epilog.sh
PrologFlags=Alloc
ReturnToService=2
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmdUser=root
JobAcctGatherType=jobacct_gather/linux
AccountingStorageType=accounting_storage/none
AccountingStorageHost=dbd-01
AuthAltTypes=auth/jwt
AuthAltParameters=jwt_key=/etc/slurm/jwt.key
SwitchType=switch/none
GresTypes=gpu
