# Hardened Slurm control-plane fixture (synthetic).
ClusterName=prod-hpc
SlurmctldHost=ctld-01
SlurmUser=slurm
AuthType=auth/munge
CryptoType=crypto/munge
TaskPlugin=task/cgroup,task/affinity
ProctrackType=proctrack/cgroup
SelectType=select/cons_tres
MpiDefault=pmix
SlurmctldParameters=id_check
PrivateData=jobs,usage,account
DisableRootJobs=YES
Prolog=/etc/slurm/prolog.sh
Epilog=/etc/slurm/epilog.sh
PrologFlags=Alloc,Contain
ReturnToService=0
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmdUser=slurm
JobAcctGatherType=jobacct_gather/cgroup
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=dbd-01
AuthAltTypes=auth/jwt
AuthAltParameters=jwt_key=/etc/slurm/jwt/jwt.key
MpiDefault=pmix
SwitchType=switch/none
GresTypes=gpu
