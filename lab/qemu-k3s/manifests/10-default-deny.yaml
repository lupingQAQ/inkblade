# Namespace + default-deny NetworkPolicy for the hostNetwork bypass proof.
#
# k3s ships a built-in network policy controller (kube-router based), so this
# policy is actually enforced without installing Calico/Cilium. The policy
# selects every Pod in the namespace and allows no Ingress/Egress at all.
apiVersion: v1
kind: Namespace
metadata:
  name: inkblade-proof
  labels:
    inkblade.dev/proof: real-cluster
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: inkblade-proof
  labels:
    inkblade.dev/proof: real-cluster
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
