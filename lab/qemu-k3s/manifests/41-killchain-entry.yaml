# Optional lab entry surface: an exposed "training API" NodePort.
# Deploy only when no service already owns host port 30080; the lab wrapper
# checks first. It is intentionally an unauthenticated HTTP control-plane
# stand-in (python http.server), not a real training service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trident-entry-api
  namespace: trident-killchain
  labels:
    app: trident-entry-api
    trident.io/lab: kill-chain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trident-entry-api
  template:
    metadata:
      labels:
        app: trident-entry-api
        trident.io/lab: kill-chain
    spec:
      automountServiceAccountToken: false
      containers:
        - name: entry
          # Minimal netcat HTTP responder: Python's http.server stalls in DNS
          # (getfqdn) under this QEMU/TCG guest. Intentional unauthenticated
          # entry surface; one request per loop iteration.
          image: alpine:3.21
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - "while true; do printf 'HTTP/1.1 200 OK\r\nContent-Length: 2\r\nConnection: close\r\n\r\nok' | nc -l -p 8000; done"
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: trident-entry-api
  namespace: trident-killchain
  labels:
    app: trident-entry-api
    trident.io/lab: kill-chain
spec:
  type: NodePort
  selector:
    app: trident-entry-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30081
