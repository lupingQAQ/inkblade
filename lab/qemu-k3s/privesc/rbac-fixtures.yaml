# Trident 提权实验室 RBAC 夹具（QEMU k3s / 任何授权集群）
# 目的：真实验证 escalate / bind / impersonate / SA TokenRequest 四条到 cluster-admin 的路径。
# 仅用于隔离实验室；apply 后由 lab/privesc_verify.py 采集 before/after 证据并默认清理。
apiVersion: v1
kind: Namespace
metadata:
  name: privesc-lab
  labels:
    trident.io/lab: privesc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: esc-sa
  namespace: privesc-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bind-sa
  namespace: privesc-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: imp-sa
  namespace: privesc-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: token-sa
  namespace: privesc-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: privesc-admin
  namespace: privesc-lab
---
# 1) escalate：已绑定角色 esc-editable + escalate 动词（update 仅限该角色）
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: esc-editable
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: esc-editable-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: esc-editable
subjects:
  - kind: ServiceAccount
    name: esc-sa
    namespace: privesc-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: escalator
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["get", "escalate"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["esc-editable"]
    verbs: ["update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: escalator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: escalator
subjects:
  - kind: ServiceAccount
    name: esc-sa
    namespace: privesc-lab
---
# 2) bind：bind cluster-admin + create ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: binder
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["cluster-admin"]
    verbs: ["bind"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: binder-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: binder
subjects:
  - kind: ServiceAccount
    name: bind-sa
    namespace: privesc-lab
---
# 3) impersonate：冒充已绑定 cluster-admin 的 User
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: impersonator
rules:
  - apiGroups: [""]
    resources: ["users"]
    resourceNames: ["privesc-superuser"]
    verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: impersonator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: impersonator
subjects:
  - kind: ServiceAccount
    name: imp-sa
    namespace: privesc-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: privesc-superuser-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: User
    name: privesc-superuser
    apiGroup: rbac.authorization.k8s.io
---
# 4) SA TokenRequest：为高权 SA 申请 token
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: privesc-admin-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: privesc-admin
    namespace: privesc-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: token-requester
  namespace: privesc-lab
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["privesc-admin"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: token-requester-binding
  namespace: privesc-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: token-requester
subjects:
  - kind: ServiceAccount
    name: token-sa
    namespace: privesc-lab
