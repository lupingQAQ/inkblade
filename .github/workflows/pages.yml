name: pages

# Publishes the documentation site. The artifact is an allowlist staged by
# scripts/build-pages-site.py, not the whole docs/ tree: internal research and
# vendor-report material must not be reachable from a public URL.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/build-docs-site.py"
      - "scripts/build-pages-site.py"
      - "scripts/check-docs-links.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generated site is up to date
        run: python scripts/build-docs-site.py --check

      - name: No external references, no broken relative links
        run: python scripts/check-docs-links.py

      - name: Stage the publishable subset
        run: python scripts/build-pages-site.py --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
