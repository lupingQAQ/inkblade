name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (editable)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .

      - name: Byte-compile package
        run: python scripts/release/compile-check.py

      - name: CLI smoke (entry point --help)
        run: python scripts/release/smoke.py

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  public-tree:
    name: public-tree + vendor integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (editable)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .
      - name: Public tree hygiene (0 hits required)
        run: python scripts/check-public-tree.py --root .
      - name: Vendored asset checksums
        run: python -m unittest tests.test_vendor_checksums -v
      - name: Plugin manifest contract
        run: python -m unittest tests.test_sdk -v

  release-hygiene:
    name: release hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Packaging metadata + docs + helm render check
        run: python scripts/release/verify.py
      - name: Build wheel and sdist
        run: python scripts/release/build.py --out dist
      - name: Install wheel in a clean venv and run the entry point
        run: |
          python -m venv /tmp/ci-venv
          /tmp/ci-venv/bin/python -m pip install --upgrade pip
          /tmp/ci-venv/bin/python -m pip install dist/*.whl
          PATH="/tmp/ci-venv/bin:$PATH" /tmp/ci-venv/bin/python scripts/release/smoke.py --installed
      - name: CycloneDX SBOM (dry run, no upload)
        run: python scripts/release/sbom.py --dist dist --out dist/sbom.cdx.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-hygiene-${{ github.run_id }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.cdx.json
          retention-days: 7
          if-no-files-found: warn
