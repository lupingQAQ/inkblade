name: probe-release

# Builds the InkBlade in-pod probe as static musl binaries for linux-amd64 and
# linux-arm64, smoke-tests the native build, and publishes checksummed
# artifacts.  Triggered by tags (probe-v*), pushes to the probe-build branch, or
# manually.
on:
  push:
    branches: [probe-build]
    tags: ["probe-v*"]
  workflow_dispatch:
    inputs:
      run_selftest:
        description: "Run the native collect/exec self-test"
        required: false
        default: "true"

permissions:
  contents: read

concurrency:
  group: probe-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: probe (${{ matrix.arch }} / ${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            triple: x86_64
            native: true
          - arch: arm64
            target: aarch64-unknown-linux-musl
            triple: aarch64
            native: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild (bundles a matching zig)
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check cargo-zigbuild
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cargo-zigbuild" --version

      - name: Build (static musl)
        working-directory: probe
        run: |
          time cargo zigbuild --release --locked --target ${{ matrix.target }}
          ls -l target/${{ matrix.target }}/release/inkblade-probe

      - name: Verify ELF + static linkage + architecture
        working-directory: probe
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/inkblade-probe"
          MAGIC=$(od -An -tx1 -N4 "$BIN" | tr -d ' \n')
          echo "magic=$MAGIC"
          test "$MAGIC" = "7f454c46"
          file "$BIN"
          SIZE=$(stat -c %s "$BIN")
          echo "size=$SIZE"
          test "$SIZE" -gt 100000
          if file "$BIN" | grep -q "statically linked"; then
            echo "linkage=static"
          else
            echo "::error::binary is not statically linked"
            exit 1
          fi
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            file "$BIN" | grep -q "x86-64"
          else
            file "$BIN" | grep -q "ARM aarch64"
          fi

      - name: Self-test (native runner only)
        if: matrix.native && (github.event_name != 'workflow_dispatch' || inputs.run_selftest != 'false')
        working-directory: probe
        run: |
          set -euo pipefail
          BIN="$PWD/target/${{ matrix.target }}/release/inkblade-probe"
          echo "== --version =="
          "$BIN" --version
          echo "== --help =="
          "$BIN" --help | tee /tmp/help.txt
          test -s /tmp/help.txt
          echo "== collect =="
          "$BIN" collect > /tmp/collect.json
          python3 - <<'PY'
          import json
          doc = json.load(open("/tmp/collect.json"))
          assert isinstance(doc, dict) and doc, "collect returned no data"
          print("collect keys:", sorted(doc)[:12])
          PY
          echo "== exec =="
          "$BIN" exec --allow-write --allow-cmd sh -- sh -c 'echo inkblade-probe-exec-ok' > /tmp/exec.json
          cat /tmp/exec.json
          python3 - <<'PY'
          import json
          doc = json.load(open("/tmp/exec.json"))
          assert doc.get("exit_code") == 0, doc
          assert "inkblade-probe-exec-ok" in json.dumps(doc), doc
          PY
          echo "== dial =="
          "$BIN" dial --host 127.0.0.1 --port 1 > /tmp/dial.json || true
          cat /tmp/dial.json || true

      - name: Package artifact
        working-directory: probe
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN="target/${{ matrix.target }}/release/inkblade-probe"
          OUT="dist/inkblade-probe-linux-${{ matrix.arch }}"
          cp "$BIN" "$OUT"
          chmod 0755 "$OUT"
          ( cd dist && sha256sum "inkblade-probe-linux-${{ matrix.arch }}" > "inkblade-probe-linux-${{ matrix.arch }}.sha256" )
          cat "dist/inkblade-probe-linux-${{ matrix.arch }}.sha256"
          file "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: inkblade-probe-linux-${{ matrix.arch }}
          path: |
            probe/dist/inkblade-probe-linux-${{ matrix.arch }}
            probe/dist/inkblade-probe-linux-${{ matrix.arch }}.sha256
          retention-days: 30
          if-no-files-found: error

  release:
    name: publish probe release
    needs: [build, python-dynamic]
    if: startsWith(github.ref, 'refs/tags/probe-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets and checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -name 'inkblade-probe-linux-*' ! -name '*.sha256' -exec cp {} dist/ \;
          cd dist
          sha256sum inkblade-probe-linux-* > SHA256SUMS
          cat SHA256SUMS
      - name: Optional cosign bundle
        if: vars.ENABLE_COSIGN == 'true'
        uses: sigstore/cosign-installer@v3
      - name: Sign checksums (optional)
        if: vars.ENABLE_COSIGN == 'true'
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "InkBlade probe $TAG" \
            --notes "Static Rust/musl probe binaries (linux amd64/arm64), built by CI. Verify with SHA256SUMS; optional cosign bundle when enabled."
          gh release upload "$TAG" dist/inkblade-probe-linux-* dist/SHA256SUMS --clobber
          if [ -f dist/SHA256SUMS.sigstore.json ]; then gh release upload "$TAG" dist/SHA256SUMS.sigstore.json --clobber; fi

  python-dynamic:
    name: python channel against real probe
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: inkblade-probe-linux-amd64
          path: probe/dist
      - name: Restore the executable bit (artifact zips drop the mode)
        run: chmod 0755 probe/dist/inkblade-probe-linux-amd64
      - name: Run framed-channel tests against the real binary
        env:
          PYTHONIOENCODING: utf-8
          INKBLADE_PROBE_BIN: ${{ github.workspace }}/probe/dist/inkblade-probe-linux-amd64
        run: |
          python -m pip install -e . cryptography
          python -m unittest tests.test_probe_rust_dynamic tests.test_probe_channel tests.test_probe_reverse tests.test_probe_reverse_rust -v
